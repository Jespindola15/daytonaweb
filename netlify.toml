# Netlify: se publica dist/ (index.html, web/, src/, game/) y la API de salas corre como Function.
[build]
  command = "node tools/build-site.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/web/"
  status = 302

[[headers]]
  for = "/game/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/game/manifest.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/web/*"
  [headers.values]
    Cache-Control = "no-cache"
